<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>MerchHub – Prototype MVP</title>
<style>
:root{--bg:#f1f3f2;--cd:#fff;--tx:#17211f;--mu:#566663;--pr:#0f5c4d;--pt:#fff;--pl:#e1ecea;--bd:#d9dfdd;--ok:#0b7a4b;--okb:#d9f4e6;--wn:#7a5200;--wnb:#ffe9b0;--er:#b3261e;--erb:#fde3e0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1514;--cd:#161d1c;--tx:#ecf1ef;--mu:#9fb0ab;--pr:#5fd1b4;--pt:#07211b;--pl:#1d2f2b;--bd:#2a3256;--ok:#62d9a2;--okb:#11392a;--wn:#ffd36b;--wnb:#40300a;--er:#ff8e84;--erb:#401814;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0f1514;--cd:#161d1c;--tx:#ecf1ef;--mu:#9fb0ab;--pr:#5fd1b4;--pt:#07211b;--pl:#1d2f2b;--bd:#2a3256;--ok:#62d9a2;--okb:#11392a;--wn:#ffd36b;--wnb:#40300a;--er:#ff8e84;--erb:#401814;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.02em}h1{font-size:clamp(28px,5vw,44px)}h2{font-size:22px}h3{font-size:16px}p{margin:0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--cd);border-bottom:1px solid var(--bd);display:flex;gap:6px 16px;align-items:center;flex-wrap:wrap;padding:10px 16px}
.logo{font-weight:800;font-size:18px;cursor:pointer;margin-right:auto}.logo b{color:var(--pr)}
.bar a{color:var(--mu);text-decoration:none;cursor:pointer;padding:6px 4px;font-weight:600}.bar a.on{color:var(--pr);box-shadow:0 2px 0 var(--pr)}
.demo{background:var(--wnb);color:var(--wn);font-size:13px;padding:6px 16px;text-align:center}
main{max-width:1040px;margin:0 auto;padding:20px 16px 48px}
.btn{border:1px solid var(--pr);background:var(--pr);color:var(--pt);border-radius:4px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn.g{background:transparent;color:var(--pr)}.btn.s{padding:5px 10px;font-size:13px}.btn.d{border-color:var(--er);background:transparent;color:var(--er)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.card:focus-visible{outline:3px solid var(--pr);outline-offset:2px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:4px;padding:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.pc{cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:0;overflow:hidden}.pc .im{height:130px;display:grid;place-items:center;color:var(--pr);background:var(--pl);border-bottom:1px solid var(--bd)}.pc .tx{padding:0 14px 14px;display:flex;flex-direction:column;gap:4px}
.mu{color:var(--mu);font-size:13px}.pr{font-weight:800}.mono{display:inline-grid;place-items:center;min-width:44px;height:44px;padding:0 8px;border:1.5px solid var(--pr);color:var(--pr);font-weight:800;border-radius:4px}
.bd{display:inline-block;border-radius:3px;padding:2px 8px;font-size:12px;font-weight:700;background:var(--pl);color:var(--pr)}.bd.ok{background:var(--okb);color:var(--ok)}.bd.wn{background:var(--wnb);color:var(--wn)}.bd.er{background:var(--erb);color:var(--er)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{display:flex;flex-direction:column;gap:14px}
.hero{padding:28px 0 18px;display:flex;flex-direction:column;gap:14px;max-width:640px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:4px;padding:9px 12px;width:100%}
.f{display:flex;flex-direction:column;gap:4px}.f label{font-weight:600;font-size:13px}.err{color:var(--er);font-size:13px}
.chip{border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:4px;padding:6px 12px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;font:inherit}.chip.on{background:var(--pr);border-color:var(--pr);color:var(--pt)}.chip:disabled{opacity:.45;text-decoration:line-through;cursor:not-allowed}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:720px){.two{grid-template-columns:1fr}}
.big{height:260px;display:grid;place-items:center;color:var(--pr);background:var(--pl);border:1px solid var(--bd);border-radius:4px}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:520px}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--bd)}th{font-size:13px;color:var(--mu)}tr.k{cursor:pointer}tr.k:hover{background:var(--pl)}
.stat{flex:1 1 140px}.stat b{font-size:28px;display:block}
.steps{display:flex;gap:6px}.steps div{flex:1;text-align:center;font-size:12px;padding-top:8px;border-top:4px solid var(--bd);color:var(--mu)}.steps .on{border-color:var(--pr);color:var(--tx);font-weight:700}
.sk{height:210px;border-radius:10px;background:linear-gradient(90deg,var(--bd),var(--pl),var(--bd));background-size:200% 100%;animation:s 1.2s infinite}@keyframes s{to{background-position:-200% 0}}
.empty{text-align:center;padding:36px 12px;color:var(--mu)}.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:8px;z-index:9}
@media(prefers-reduced-motion:reduce){.sk{animation:none}}
</style></head><body><div id="app"></div><div id="t"></div>
<script>
const $=s=>document.querySelector(s),T='2026-11-05',rp=n=>'Rp'+n.toLocaleString('id-ID'),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ST=['Baru','Diproses','Siap Diambil','Selesai'],CATS=['Jaket','Kaos','Tote Bag','Tumbler','Lanyard'],EM={Jaket:'🧥',Kaos:'👕','Tote Bag':'🛍️',Tumbler:'🥤',Lanyard:'🎫'};
const O=[
{id:'hmsi',n:'Himpunan Mahasiswa Sistem Informasi',u:'Universitas Demo A',e:'💻',d:'Wadah mahasiswa Sistem Informasi untuk belajar, berkarya, dan berjejaring.',c:'@hmsi.demo',pay:'Transfer ke rekening bendahara (nomor dikirim via kontak resmi) atau bayar tunai di sekretariat.',pk:'Ambil di sekretariat HMSI, Senin–Jumat 10.00–15.00.'},
{id:'hmif',n:'Himpunan Mahasiswa Informatika',u:'Universitas Demo B',e:'⚙️',d:'Himpunan mahasiswa Informatika, penyelenggara Coding Night tahunan.',c:'@hmif.demo',pay:'Transfer, atau COD saat pengambilan di kampus.',pk:'COD di selasar Gedung Informatika setiap Rabu.'},
{id:'bemfe',n:'BEM Fakultas Ekonomi',u:'Universitas Demo C',e:'📈',d:'Badan eksekutif mahasiswa Fakultas Ekonomi.',c:'@bemfe.demo',pay:'Transfer ke rekening BEM.',pk:'Ambil di ruang BEM lantai 2.'},
{id:'ukmfoto',n:'UKM Fotografi',u:'Universitas Demo A',e:'📷',d:'Komunitas mahasiswa pecinta fotografi.',c:'@ukmfoto.demo',pay:'Transfer atau tunai saat pengambilan.',pk:'Ambil di studio UKM Fotografi.'}];
const mk=(id,o,n,cat,price,st,a,b,d)=>({id,o,n,cat,price,st,a,b,d});
let P=[mk(1,'hmsi','Jaket Angkatan 2026','Jaket',185000,{S:10,M:15,L:12,XL:0},'2026-10-25','2026-11-20','Jaket bomber bahan fleece, bordir logo di dada. Produksi setelah pre-order ditutup.'),
mk(2,'hmsi','Kaos Himpunan','Kaos',85000,{S:20,M:30,L:30,XL:15},'2026-11-01','2026-11-30','Kaos cotton combed 24s, sablon plastisol.'),
mk(3,'hmsi','Lanyard SI','Lanyard',15000,{'One Size':50},'2026-10-01','2026-11-02','Lanyard 2 cm dua sisi.'),
mk(4,'hmif','Tumbler Informatika','Tumbler',95000,{'500 ml':20},'2026-11-03','2026-11-25','Tumbler stainless 500 ml, tahan panas dan dingin.'),
mk(5,'hmif','Kaos Coding Night','Kaos',90000,{S:12,M:25,L:20,XL:10},'2026-11-03','2026-11-25','Kaos edisi Coding Night.'),
mk(6,'bemfe','Tote Bag BEM FE','Tote Bag',45000,{'Standar':40},'2026-11-01','2026-12-01','Tote bag kanvas dengan saku dalam.'),
mk(7,'bemfe','Jaket Fakultas','Jaket',195000,{M:10,L:10,XL:8},'2026-11-04','2026-11-28','Jaket varsity warna navy.'),
mk(8,'ukmfoto','Tote Bag Lensa','Tote Bag',55000,{'Standar':25},'2026-10-28','2026-11-18','Tote bag kanvas ilustrasi lensa.')];
let D=[{id:'ORD-1001',pid:1,v:'M',q:1,name:'Raka Pratama',hp:'081234567801',pick:'Ambil di sekretariat',note:'',s:'Baru'},
{id:'ORD-1002',pid:2,v:'L',q:2,name:'Siti Aulia',hp:'081234567802',pick:'COD di kampus',note:'Ambil Rabu',s:'Diproses'},
{id:'ORD-1003',pid:1,v:'L',q:1,name:'Dimas Putra',hp:'081234567803',pick:'Ambil di sekretariat',note:'',s:'Siap Diambil'},
{id:'ORD-1004',pid:3,v:'One Size',q:3,name:'Nadia Rahma',hp:'081234567804',pick:'Ambil di sekretariat',note:'',s:'Selesai'}];
let S={q:'',uni:'',org:'',cat:'',pid:0,v:null,n:1,f:{name:'',hp:'',pick:'Ambil di sekretariat',note:''},er:{},lq:'',okmsg:0,in:0,of:'Semua',os:null,pf:null,del:0,load:0,seen:0,busy:0,le:''};
const R=()=>location.hash.slice(1)||'home',go=h=>{location.hash=h};
const org=id=>O.find(o=>o.id==id),prod=id=>P.find(p=>p.id==id),tot=p=>Object.values(p.st).reduce((a,b)=>a+b,0),open=p=>p.a<=T&&T<=p.b;
const toast=m=>{$('#t').innerHTML='<div class="toast" role="status">'+E(m)+'</div>';setTimeout(()=>$('#t').innerHTML='',2200)};
const empty=(m,b='')=>`<div class="card empty"><p>${m}</p><br>${b}</div>`;
const badge=p=>tot(p)==0?'<span class="bd er">Stok habis</span>':open(p)?`<span class="bd ok">Pre-order sampai ${p.b.slice(8)}/${p.b.slice(5,7)}</span>`:'<span class="bd wn">Pre-order ditutup</span>';
const pcard=p=>`<div class="card pc" tabindex="0" onclick="go('produk-${p.id}')" onkeydown="if(event.key=='Enter')go('produk-${p.id}')"><div class="im">${ic(p.cat,56)}</div><div class="tx"><h3>${E(p.n)}</h3><span class="mu">${E(org(p.o).n)} · ${E(org(p.o).u)}</span><span class="pr">${rp(p.price)}</span><span>${badge(p)}</span></div></div>`;
function nav(r,dash){
 if(!dash)return`<div class="demo">Prototype untuk uji kegunaan. Semua universitas dan organisasi adalah data demonstrasi, bukan mitra terverifikasi.</div><div class="bar"><span class="logo" onclick="go('home')">Merch<b>Hub</b></span><a class="${r=='explore'?'on':''}" onclick="go('explore')">Jelajah</a><a class="${r=='status'?'on':''}" onclick="go('status')">Cek pesanan</a><a class="${r=='uji'?'on':''}" onclick="go('uji')">Panduan uji</a><button class="btn g s" onclick="go(S.in?'dash':'login')">Masuk sebagai pengurus</button></div>`;
 const t=[['dash','Ringkasan'],['dash-produk','Produk'],['dash-pesanan','Pesanan'],['dash-profil','Profil']].map(x=>`<a class="${r==x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</a>`).join('');
 return`<div class="demo">Dashboard pengurus · ${E(O[0].n)} (demo)</div><div class="bar"><span class="logo" onclick="go('dash')">Merch<b>Hub</b> Pengurus</span>${t}<button class="btn g s" onclick="go('home')">Lihat sisi pembeli</button><button class="btn g s" onclick="S.in=0;go('home')">Keluar</button></div>`}
function home(){const l=[...P].reverse().slice(0,4);
 return`<section class="hero"><h1>Merchandise organisasi kampus, dalam satu katalog.</h1><p class="mu">Temukan jaket, kaos, dan tote bag dari himpunan, BEM, dan UKM berbagai universitas, lalu pesan langsung.</p><div class="row"><input id="hq" aria-label="Cari merchandise" placeholder="Cari jaket, kaos, tumbler…" style="flex:1 1 220px;width:auto" onkeydown="if(event.key=='Enter')hs()"><button class="btn" onclick="hs()">Cari</button></div><div class="row">${CATS.map(c=>`<button class="chip" onclick="S.cat='${c}';S.q='';go('explore')">${ic(c,16)}${c}</button>`).join('')}</div></section>
 <div class="sp"><div class="row"><h2 style="margin-right:auto">Merchandise terbaru</h2><button class="btn g s" onclick="S.cat='';S.q='';go('explore')">Lihat semua katalog</button></div><div class="grid">${l.map(pcard).join('')}</div>
 <h2>Organisasi</h2><div class="grid">${O.map(o=>`<div class="card" style="cursor:pointer" onclick="go('org-${o.id}')"><span class="mono">${mg(o)}</span><h3>${E(o.n)}</h3><span class="mu">${E(o.u)} · ${P.filter(p=>p.o==o.id).length} produk</span></div>`).join('')}</div></div>`}
const hs=()=>{S.q=$('#hq').value;S.cat='';go('explore')};
function list(){const q=S.q.toLowerCase(),r=P.filter(p=>(!S.uni||org(p.o).u==S.uni)&&(!S.org||p.o==S.org)&&(!S.cat||p.cat==S.cat)&&(!q||(p.n+org(p.o).n).toLowerCase().includes(q)));
 return r.length?r.map(pcard).join(''):`<div style="grid-column:1/-1">${empty('Tidak ada merchandise yang cocok dengan filter ini. Ubah kata kunci atau reset filter.','<button class="btn g s" onclick="S.q=S.uni=S.org=S.cat=\'\';render()">Reset filter</button>')}</div>`}
function explore(){if(!S.seen){S.seen=1;S.load=1;setTimeout(()=>{S.load=0;if(R()=='explore')render()},500)}
 const us=[...new Set(O.map(o=>o.u))],sel=(k,a,ph)=>`<select aria-label="${ph}" onchange="S.${k}=this.value;$('#g').innerHTML=list()" style="width:auto;flex:1 1 150px"><option value="">${ph}</option>${a.map(x=>`<option value="${E(x[0])}" ${S[k]==x[0]?'selected':''}>${E(x[1])}</option>`).join('')}</select>`;
 return`<div class="sp"><h2>Jelajah merchandise</h2><div class="row"><input aria-label="Cari" placeholder="Cari produk atau organisasi" value="${E(S.q)}" oninput="S.q=this.value;$('#g').innerHTML=list()" style="flex:2 1 200px;width:auto">${sel('uni',us.map(u=>[u,u]),'Semua universitas')}${sel('org',O.map(o=>[o.id,o.n]),'Semua organisasi')}${sel('cat',CATS.map(c=>[c,c]),'Semua kategori')}</div><div class="grid" id="g">${S.load?'<div class="sk"></div>'.repeat(4):list()}</div></div>`}
function detail(id){const p=prod(id);if(!p)return empty('Produk tidak ditemukan.','<button class="btn" onclick="go(\'explore\')">Ke katalog</button>');
 if(S.pid!=id){S.pid=id;S.v=null;S.n=1;S.le=''}const o=org(p.o),can=open(p)&&tot(p)>0,mx=S.v?p.st[S.v]:0;
 return`<div class="two"><div class="big">${ic(p.cat,110)}</div><div class="sp"><div><span class="mu">${E(p.cat)}</span><h1 style="font-size:30px">${E(p.n)}</h1><p class="mu"><a href="#org-${o.id}" style="color:var(--pr)">${E(o.n)}</a> · ${E(o.u)}</p></div><div class="pr" style="font-size:24px">${rp(p.price)}</div><div>${badge(p)}<p class="mu" style="margin-top:6px">Periode pre-order: ${p.a} s.d. ${p.b}</p></div><p>${E(p.d)}</p>
 <div class="f"><label>Ukuran / variasi</label><div class="row">${Object.entries(p.st).map(([k,s])=>`<button class="chip ${S.v==k?'on':''}" ${s?'':'disabled'} onclick="S.v='${k}';S.n=1;S.le='';render()">${E(k)}${s?'':' (habis)'}</button>`).join('')}</div><span class="mu">${S.v?'Stok '+S.v+': '+mx:'Total stok: '+tot(p)}</span></div>
 <div class="f"><label>Jumlah</label><div class="row"><button class="btn g s" aria-label="Kurangi" onclick="qty(-1)">−</button><b>${S.n}</b><button class="btn g s" aria-label="Tambah" onclick="qty(1)">+</button></div></div>
 ${S.le?`<p class="err" role="alert">${S.le}</p>`:''}<button class="btn" ${can?'':'disabled'} onclick="pesan()">${can?'Pesan sekarang':open(p)?'Stok habis':'Pre-order ditutup'}</button></div></div>`}
const qty=d=>{const p=prod(S.pid),mx=S.v?p.st[S.v]:99;S.n=Math.max(1,Math.min(mx,S.n+d));render()};
const pesan=()=>{if(!S.v){S.le='Pilih ukuran atau variasi terlebih dahulu.';render();return}S.cart={pid:S.pid,v:S.v,q:S.n};S.er={};go('checkout')};
function checkout(){const c=S.cart;if(!c)return empty('Belum ada produk yang dipilih.','<button class="btn" onclick="go(\'explore\')">Pilih merchandise</button>');
 const p=prod(c.pid),o=org(p.o),e=S.er,fl=(k,l,t='text',ph='')=>`<div class="f"><label for="${k}">${l}</label><input id="${k}" type="${t}" placeholder="${ph}" value="${E(S.f[k])}" oninput="S.f.${k}=this.value">${e[k]?`<span class="err" role="alert">${e[k]}</span>`:''}</div>`;
 return`<h2 style="margin-bottom:14px">Pemesanan</h2><div class="two"><div class="sp">${fl('name','Nama lengkap')}${fl('hp','Nomor WhatsApp / HP','tel','08xxxxxxxxxx')}<div class="f"><label for="pick">Metode pengambilan</label><select id="pick" onchange="S.f.pick=this.value"><option>Ambil di sekretariat</option><option>COD di kampus</option></select></div>${fl('note','Catatan (opsional)')}</div>
 <div class="card sp"><h3>Ringkasan pesanan</h3><div class="row"><span style="color:var(--pr)">${ic(p.cat,36)}</span><div><b>${E(p.n)}</b><div class="mu">${E(c.v)} × ${c.q} · ${E(o.n)}</div></div></div><div class="row"><span style="margin-right:auto">Total</span><b style="font-size:20px">${rp(p.price*c.q)}</b></div><p class="mu">Pembayaran: ${E(o.pay)} Platform tidak memproses pembayaran.</p><button class="btn" ${S.busy?'disabled':''} onclick="konfirm()">${S.busy?'Memproses…':'Konfirmasi pemesanan'}</button><button class="btn g" onclick="go('produk-${p.id}')">Kembali ke produk</button></div></div>`}
function konfirm(){const f=S.f,e={};if(!f.name.trim())e.name='Nama wajib diisi.';if(!/^08\d{8,11}$/.test(f.hp.replace(/[\s-]/g,'')))e.hp='Isi nomor HP yang valid, contoh 081234567890.';S.er=e;if(Object.keys(e).length){render();return}
 S.busy=1;render();setTimeout(()=>{const c=S.cart,p=prod(c.pid);if(p.st[c.v]<c.q){S.busy=0;S.er={name:'Stok tidak cukup. Kembali ke produk dan kurangi jumlah.'};render();return}
 p.st[c.v]-=c.q;const id='ORD-'+(1001+D.length);D.push({id,pid:c.pid,v:c.v,q:c.q,name:f.name.trim(),hp:f.hp,pick:f.pick,note:f.note,s:'Baru'});S.lq=id;S.okmsg=1;S.busy=0;S.cart=null;S.f={name:'',hp:'',pick:'Ambil di sekretariat',note:''};go('status');render()},700)}
function status(){const d=D.find(x=>x.id==S.lq.trim().toUpperCase()),ok=S.okmsg;S.okmsg=0;let b;
 if(!S.lq.trim())b=empty('Masukkan nomor pesanan untuk melihat status. Contoh: ORD-1001.');else if(!d)b=`<div class="card err" role="alert">Nomor pesanan ${E(S.lq)} tidak ditemukan. Periksa penulisannya.</div>`;
 else{const p=prod(d.pid),o=org(p.o),i=ST.indexOf(d.s);b=`${ok?`<div class="card" style="background:var(--okb);color:var(--ok)" role="status"><b>Pesanan terkirim.</b> Simpan nomor pesanan ${d.id} untuk memeriksa statusnya.</div>`:''}<div class="card sp"><div class="row"><h3 style="margin-right:auto">${d.id}</h3><span class="bd ${i==3?'ok':''}">${d.s}</span></div><div class="steps">${ST.map((s,k)=>`<div class="${k<=i?'on':''}">${s}</div>`).join('')}</div><p><b>${E(p.n)}</b> · ${E(d.v)} × ${d.q} · ${rp(p.price*d.q)}</p><p class="mu">Pemesan: ${E(d.name)} · ${E(d.hp)} · ${E(d.pick)}</p><hr style="border:0;border-top:1px solid var(--bd);width:100%"><p><b>${E(o.n)}</b> (${E(o.u)})</p><p class="mu">Pembayaran: ${E(o.pay)}</p><p class="mu">Pengambilan: ${E(o.pk)}</p><p class="mu">Kontak resmi: ${E(o.c)}</p></div>`}
 return`<div class="sp" style="max-width:640px"><h2>Cek status pesanan</h2><div class="row"><input id="lq" aria-label="Nomor pesanan" placeholder="Nomor pesanan, mis. ORD-1001" value="${E(S.lq)}" style="flex:1 1 200px;width:auto" onkeydown="if(event.key=='Enter'){S.lq=this.value;render()}"><button class="btn" onclick="S.lq=$('#lq').value;render()">Cari</button></div>${b}</div>`}
function orgp(id){const o=org(id);if(!o)return empty('Organisasi tidak ditemukan.');return`<div class="sp"><div class="card row"><span class="mono" style="min-width:64px;height:64px;font-size:20px">${mg(o)}</span><div><h2>${E(o.n)}</h2><p class="mu">${E(o.u)} · Kontak resmi: ${E(o.c)}</p></div></div><p>${E(o.d)}</p><h2>Merchandise</h2><div class="grid">${P.filter(p=>p.o==id).map(pcard).join('')||empty('Belum ada merchandise.')}</div></div>`}
function uji(){return`<div class="sp" style="max-width:760px"><h2>Panduan uji kegunaan</h2><p class="mu">Berikan tugas tanpa bantuan. Catat waktu, kesalahan, dan komentar. Jangan mengarahkan responden untuk menyukai produk.</p>
 <div class="card sp"><h3>Skenario 1 – Pembeli (mulai dari Beranda)</h3><ol><li>Cari kaos atau jaket dari himpunan.</li><li>Buka detail produk, pilih ukuran dan jumlah.</li><li>Isi data lalu konfirmasi pesanan.</li><li>Temukan status pesanan Anda.</li></ol><button class="btn s" onclick="go('home')">Mulai sebagai pembeli</button></div>
 <div class="card sp"><h3>Skenario 2 – Pengurus (masuk dengan isian bebas)</h3><ol><li>Masuk lalu buka dashboard.</li><li>Tambahkan satu merchandise.</li><li>Buka daftar dan detail pesanan.</li><li>Ubah status pesanan, lalu baca rekap per ukuran.</li></ol><button class="btn s" onclick="go('login')">Mulai sebagai pengurus</button></div>
 <div class="card"><h3>Yang diukur</h3><p class="mu">Selesai tanpa bantuan (ya/tidak), waktu per tugas, jumlah salah klik, skor kemudahan 1–5, dan satu pertanyaan terbuka: apa yang membingungkan? Tanyakan juga apakah mereka biasa memesan lewat Instagram/WhatsApp, agar masalah yang diasumsikan ikut teruji.</p></div></div>`}
function login(){return`<div class="card sp" style="max-width:380px;margin:30px auto"><h2>Masuk pengurus</h2><p class="mu">Demo: isi email dan kata sandi apa saja.</p><div class="f"><label for="em">Email</label><input id="em" type="email" placeholder="pengurus@hmsi.demo"></div><div class="f"><label for="pw">Kata sandi</label><input id="pw" type="password"></div>${S.le?`<p class="err" role="alert">${S.le}</p>`:''}<button class="btn" onclick="if($('#em').value&&$('#pw').value){S.in=1;S.le='';go('dash')}else{S.le='Email dan kata sandi wajib diisi.';render()}">Masuk</button></div>`}
const mine=()=>D.filter(d=>prod(d.pid).o=='hmsi'),cnt=s=>mine().filter(d=>s.includes(d.s)).length;
function ov(){const m=mine(),rk={};m.filter(d=>d.s!='Selesai').forEach(d=>{const k=prod(d.pid).n+'|'+d.v;rk[k]=(rk[k]||0)+d.q});
 return`<div class="sp"><h2>Ringkasan</h2><div class="row">${[['Total pesanan',m.length],['Pesanan baru',cnt(['Baru'])],['Diproses',cnt(['Diproses','Siap Diambil'])],['Selesai',cnt(['Selesai'])]].map(x=>`<div class="card stat"><span class="mu">${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>
 <div class="card sp"><h3>Rekap yang perlu disiapkan (belum selesai)</h3>${Object.keys(rk).length?`<div class="sc"><table><tr><th>Produk</th><th>Variasi</th><th>Jumlah</th></tr>${Object.entries(rk).map(([k,v])=>`<tr><td>${E(k.split('|')[0])}</td><td>${E(k.split('|')[1])}</td><td>${v}</td></tr>`).join('')}</table></div>`:'<p class="mu">Semua pesanan sudah selesai.</p>'}</div>
 <div class="row"><button class="btn" onclick="S.pf={};S.del=0;go('dash-produk')">Tambah merchandise</button><button class="btn g" onclick="go('dash-pesanan')">Lihat pesanan masuk</button></div></div>`}
const stk=s=>Object.entries(s).map(([k,v])=>k+':'+v).join(', ');
function dprod(){const f=S.pf,ps=P.filter(p=>p.o=='hmsi');
 const form=f?`<div class="card sp"><h3>${f.id?'Edit':'Tambah'} produk</h3><div class="f"><label for="pn">Nama produk</label><input id="pn" value="${E(f.n||'')}"></div><div class="row"><div class="f" style="flex:1 1 140px"><label for="pc">Kategori</label><select id="pc">${CATS.map(c=>`<option ${f.cat==c?'selected':''}>${c}</option>`).join('')}</select></div><div class="f" style="flex:1 1 140px"><label for="pp">Harga (Rp)</label><input id="pp" type="number" min="0" value="${f.price||''}"></div></div><div class="f"><label for="ps">Variasi dan stok</label><input id="ps" placeholder="S:10, M:15, L:12" value="${E(f.st?stk(f.st):'')}"></div><div class="row"><div class="f" style="flex:1 1 140px"><label for="pa">Pre-order mulai</label><input id="pa" type="date" value="${f.a||T}"></div><div class="f" style="flex:1 1 140px"><label for="pb">Pre-order selesai</label><input id="pb" type="date" value="${f.b||''}"></div></div><div class="f"><label for="pd">Deskripsi</label><textarea id="pd" rows="2">${E(f.d||'')}</textarea></div><p class="mu">Foto produk: pada prototype ini ditampilkan ikon kategori.</p>${S.le?`<p class="err" role="alert">${S.le}</p>`:''}<div class="row"><button class="btn" onclick="simpan(${f.id||0})">Simpan produk</button><button class="btn g" onclick="S.pf=null;S.le='';render()">Batal</button></div></div>`:'';
 return`<div class="sp"><div class="row"><h2 style="margin-right:auto">Produk</h2><button class="btn" onclick="S.pf={};render()">Tambah produk</button></div>${form}${ps.length?`<div class="sc card"><table><tr><th>Produk</th><th>Harga</th><th>Stok</th><th>Pre-order</th><th></th></tr>${ps.map(p=>`<tr><td><span class="row" style="flex-wrap:nowrap;gap:8px"><span style="color:var(--pr)">${ic(p.cat,20)}</span>${E(p.n)}</span></td><td>${rp(p.price)}</td><td>${E(stk(p.st))}</td><td>${badge(p)}</td><td class="row"><button class="btn g s" onclick="S.pf=prod(${p.id});S.le='';render();scrollTo(0,0)">Edit</button>${S.del==p.id?`<button class="btn d s" onclick="P=P.filter(x=>x.id!=${p.id});S.del=0;toast('Produk dihapus');render()">Ya, hapus</button><button class="btn g s" onclick="S.del=0;render()">Batal</button>`:`<button class="btn d s" onclick="S.del=${p.id};render()">Hapus</button>`}</td></tr>`).join('')}</table></div>`:empty('Belum ada produk. Tambahkan merchandise pertama Anda.')}</div>`}
function simpan(id){const v=k=>$('#'+k).value.trim(),st={};v('ps').split(',').forEach(x=>{const [a,b]=x.split(':');if(a&&a.trim()&&!isNaN(+b))st[a.trim()]=+b});
 if(!v('pn')||!(+v('pp')>0)||!Object.keys(st).length||!v('pb')||v('pb')<v('pa')){S.le='Lengkapi nama, harga, variasi dengan format "S:10, M:15", dan periode pre-order yang valid.';S.pf={...(S.pf||{}),n:v('pn')};render();return}
 const o={o:'hmsi',n:v('pn'),cat:v('pc'),price:+v('pp'),st,a:v('pa'),b:v('pb'),d:v('pd')};if(id)Object.assign(prod(id),o);else P.push({id:Math.max(...P.map(p=>p.id))+1,...o});S.pf=null;S.le='';toast('Produk disimpan');render()}
function dord(){const m=mine().filter(d=>S.of=='Semua'||d.s==S.of),x=D.find(d=>d.id==S.os);
 const det=x?(p=>`<div class="card sp"><div class="row"><h3 style="margin-right:auto">${x.id}</h3><span class="bd">${x.s}</span></div><p><b>${E(p.n)}</b> · ${E(x.v)} × ${x.q} · ${rp(p.price*x.q)}</p><p class="mu">Pembeli: ${E(x.name)} · ${E(x.hp)}<br>Pengambilan: ${E(x.pick)}${x.note?'<br>Catatan: '+E(x.note):''}</p><div class="row"><span class="mu">Ubah status:</span>${ST.map(s=>`<button class="chip ${x.s==s?'on':''}" onclick="D.find(d=>d.id=='${x.id}').s='${s}';toast('Status diperbarui: ${s}');render()">${s}</button>`).join('')}</div></div>`)(prod(x.pid)):'';
 return`<div class="sp"><h2>Pesanan masuk</h2><div class="row">${['Semua',...ST].map(s=>`<button class="chip ${S.of==s?'on':''}" onclick="S.of='${s}';render()">${s}</button>`).join('')}</div>${m.length?`<div class="sc card"><table><tr><th>No.</th><th>Pembeli</th><th>Produk</th><th>Jml</th><th>Status</th></tr>${m.map(d=>`<tr class="k" tabindex="0" onclick="S.os='${d.id}';render()" onkeydown="if(event.key=='Enter'){S.os='${d.id}';render()}"><td>${d.id}</td><td>${E(d.name)}</td><td>${E(prod(d.pid).n)} (${E(d.v)})</td><td>${d.q}</td><td><span class="bd">${d.s}</span></td></tr>`).join('')}</table></div>`:empty('Tidak ada pesanan dengan status ini.')}${det}</div>`}
function dprof(){const o=O[0];return`<div class="sp" style="max-width:560px"><h2>Profil organisasi</h2><div class="f"><label for="on">Nama organisasi</label><input id="on" value="${E(o.n)}"></div><div class="f"><label>Universitas</label><input value="${E(o.u)}" disabled></div><div class="f"><label for="od">Deskripsi</label><textarea id="od" rows="3">${E(o.d)}</textarea></div><div class="f"><label for="oc">Kontak resmi</label><input id="oc" value="${E(o.c)}"></div><div class="f"><label for="op">Informasi pembayaran</label><textarea id="op" rows="2">${E(o.pay)}</textarea></div><button class="btn" onclick="O[0].n=$('#on').value||O[0].n;O[0].d=$('#od').value;O[0].c=$('#oc').value;O[0].pay=$('#op').value;toast('Profil disimpan');render()">Simpan profil</button></div>`}
function render(){const r=R(),dash=r.startsWith('dash');if(dash&&!S.in){go('login');return}let b;
 if(r=='home')b=home();else if(r=='explore')b=explore();else if(r.startsWith('produk-'))b=detail(+r.slice(7));else if(r=='checkout')b=checkout();else if(r=='status')b=status();else if(r.startsWith('org-'))b=orgp(r.slice(4));else if(r=='uji')b=uji();else if(r=='login')b=login();else if(r=='dash')b=ov();else if(r=='dash-produk')b=dprod();else if(r=='dash-pesanan')b=dord();else if(r=='dash-profil')b=dprof();else b=empty('Halaman tidak ditemukan.','<button class="btn" onclick="go(\'home\')">Ke beranda</button>');
 $('#app').innerHTML=nav(r,dash)+'<main>'+b+'</main>'}
const pa=d=>`<path d="${d}"/>`,SH='M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z',
IP={Kaos:pa(SH),Jaket:pa(SH)+pa('M12 7v14'),'Tote Bag':pa('M5 8h14l1 13H4z')+pa('M9 8V6a3 3 0 0 1 6 0v2'),Tumbler:pa('M7 3h10l-1 18a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1z')+pa('M7.5 8h9'),Lanyard:pa('M9 2l3 9 3-9')+pa('M8 11h8a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1z')},
ic=(n,s=48)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IP[n]||''}</svg>`,
mg=o=>({hmsi:'SI',hmif:'IF',bemfe:'FE',ukmfoto:'FT'})[o.id]||'OR';
addEventListener('hashchange',()=>{render();scrollTo(0,0)});render();
</script></body></html>
